name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: ./mvnw --batch-mode verify
